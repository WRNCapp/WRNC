name: Submit exact iOS build
run_name: Submit iOS build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: Exact EAS iOS build ID to submit

jobs:
  submit_ios:
    name: Submit exact build to App Store Connect
    type: submit
    params:
      build_id: ${{ inputs.build_id }}
      profile: qa
