name: Validate and Build iOS

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'launch/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build a store-signed iOS artifact after validation
        required: true
        default: false
        type: boolean
      build_profile:
        description: EAS environment to build
        required: true
        default: qa
        type: choice
        options:
          - qa
          - production

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type checking
        run: npm run type-check

      - name: Run tests
        run: npm test -- --runInBand --forceExit

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Export web bundle
        run: npm run build:web

  build-ios:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build store-signed iOS artifact
        run: npx eas-cli build --platform ios --profile "${{ inputs.build_profile }}" --non-interactive --no-wait
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}

# Submission is intentionally excluded. Submit a verified build by exact build ID
# so an unrelated newer EAS artifact can never be uploaded by accident.
